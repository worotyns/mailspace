name: release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
env:
  MAILSPACE_ORIGIN: https://mail.example.test
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate semver tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run format:check && npm run build && npm test
        working-directory: web
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker compose config --quiet
      - name: Container build and smoke
        run: |
          docker compose up --build -d
          trap 'docker compose logs; docker compose down' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/api/health
          curl --fail --location http://127.0.0.1:8080/ | grep -q Mailspace
          curl --fail http://127.0.0.1:8080/source.tar.gz -o /tmp/source.tar.gz
          tar -tzf /tmp/source.tar.gz | grep -q AGENTS.md
  assets:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run format:check && npm run build && npm test
        working-directory: web
      - name: Assemble binaries and sources
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p artifacts stage/dist
          git archive --format=tar.gz --prefix=mailspace/ HEAD > "artifacts/mailspace-${VERSION}-source.tar.gz"
          cp "artifacts/mailspace-${VERSION}-source.tar.gz" stage/dist/source.tar.gz
          cp LICENSE README.md AGENTS.md CONTRIBUTING.md SECURITY.md stage/
          cp -R docs licenses stage/
          go run scripts/notices.go > stage/licenses/THIRD_PARTY_GO.txt
          git rev-parse HEAD > stage/REVISION
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o stage/mailspace ./cmd/mailspace
            tar -czf "artifacts/mailspace-${VERSION}-${target%/*}-${target#*/}.tar.gz" -C stage .
          done
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/
          if-no-files-found: error
  publish:
    needs: assets
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Early alpha for controlled self-hosted testing. Authenticated personal mode, TLS IMAP/SMTP, private Spaces and client OpenPGP/MIME alpha. Read docs/RELEASE_READINESS.md before deployment.\n\nContainer: `%s@%s`\n\n' "$IMAGE" "$DIGEST" > /tmp/notes.md
          gh release create "$TAG" artifacts/* --verify-tag --prerelease --title "Mailspace $TAG" --notes-file /tmp/notes.md
